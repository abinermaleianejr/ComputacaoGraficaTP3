plugins {
    id 'application'
}

repositories {
    maven {
        url = uri('https://jogamp.org/deployment/maven/')
    }
    mavenCentral()
}

dependencies {
    implementation 'org.jogamp.jogl:jogl-all-main:2.5.0'
    implementation 'org.jogamp.gluegen:gluegen-rt-main:2.5.0'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src/resources']
        }
    }
}

application {
    mainClass = 'main.Main'
}
